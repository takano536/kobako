name: Release Verify Heal

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: kobako-release-heal
  cancel-in-progress: false

jobs:
  heal:
    name: heal-missing-verify-handoff
    if: >-
      github.repository == 'takano536/kobako' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main without a credential helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Heal only a missing verify handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: node scripts/release-automation.mjs heal-main
