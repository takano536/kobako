name: Delete a worker

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'worker name to delete'
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the script
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "${RUNNER_TEMP}/out.json" -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/workers/scripts/${NAME}")
          cat "${RUNNER_TEMP}/out.json"
          echo
          if [ "${code}" != "200" ]; then
            echo "Cloudflare returned HTTP ${code}" >&2
            exit 1
          fi
