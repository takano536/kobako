name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Release Please tag to publish (vX.Y.Z)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Reusable workflows inherit the caller's github context. The release input
  # is therefore the only reliable discriminator for release CI.
  group: kobako-ci-${{ inputs.release_tag != '' && format('release-{0}', inputs.release_tag) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ inputs.release_tag == '' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI-only credentials; these are not production secrets.
      DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_dev
      TEST_DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci_kobako
          POSTGRES_PASSWORD: ci_kobako_password
          POSTGRES_DB: kobako_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_kobako -d kobako_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Create isolated test database
        run: PGPASSWORD=ci_kobako_password psql -h localhost -U ci_kobako -d kobako_dev -c 'CREATE DATABASE kobako_test'
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # E2E runs the web server and cleanup against this dedicated test DB.
      # DATABASE_URL is intentionally unset, so the guard only verifies TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_e2e_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci_kobako
          POSTGRES_PASSWORD: ci_kobako_password
          POSTGRES_DB: kobako_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_kobako -d kobako_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          tags: kobako-web:local
          load: true
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          tags: kobako-migrate:local
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          tags: kobako-worker:local
          load: true
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=kobako-worker
          cache-to: type=gha,mode=max,scope=kobako-worker,ignore-error=true
      - name: Create CI compose environment
        run: |
          cat > .env <<'EOF'
          # Fixed CI-only values; not production secrets.
          POSTGRES_USER=kobako_ci
          POSTGRES_PASSWORD=kobako_ci_password
          POSTGRES_DB=kobako
          COMPOSE_DATABASE_URL=postgresql://kobako_ci:kobako_ci_password@postgres:5432/kobako
          EOF
      - name: Validate self-host Compose configuration
        env:
          POSTGRES_PASSWORD: ci_selfhost_password
        run: docker compose -f compose.selfhost.yaml config >/dev/null
      - name: Start Compose stack and verify health
        run: |
          docker compose up -d
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo 'Compose health checks did not become ready' >&2
              exit 1
            fi
            sleep 5
          done
          test "$(docker compose ps -aq migrate | xargs docker inspect -f '{{.State.ExitCode}}')" = 0
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/api/health/db
      - name: Wait for idle worker and web services
        run: |
          sleep 30
          running_services="$(docker compose ps --status running --services)"
          for service in web worker; do
            if ! printf '%s\n' "$running_services" | grep -qx "$service"; then
              echo "Expected $service to remain running; got:" >&2
              printf '%s\n' "$running_services" >&2
              exit 1
            fi
          done
      - name: Stop services and verify graceful shutdown
        run: |
          docker compose stop -t 20
          web_container_id="$(docker compose ps -aq web)"
          worker_container_id="$(docker compose ps -aq worker)"
          test -n "$web_container_id"
          test -n "$worker_container_id"
          web_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$web_container_id")"
          worker_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$worker_container_id")"
          echo "web exit code: $web_exit_code"
          echo "worker exit code: $worker_exit_code"
          # Next standalone closes HTTP before its conventional SIGTERM exit 143; 137 is a timeout/SIGKILL.
          if [ "$web_exit_code" = 137 ]; then
            echo 'web was SIGKILLed or timed out' >&2
            exit 1
          fi
          if [ "$web_exit_code" != 0 ] && [ "$web_exit_code" != 143 ]; then
            echo "unexpected web exit code: $web_exit_code" >&2
            exit 1
          fi
          test "$worker_exit_code" = 0
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: publish
    if: inputs.release_tag != '' || (inputs.release_tag == '' && github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [lint, unit, integration, build, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      # Main publishes retain the existing cancellation policy. A release
      # publish has a distinct group, so it cannot cancel that main run.
      group: kobako-publish-${{ inputs.release_tag != '' && format('release-{0}', inputs.release_tag) || 'main' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image tags
        id: tags
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/compute-release-tags.sh
      - name: Verify release tag points at this commit
        if: steps.tags.outputs.mode == 'release'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tagged_revision="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tagged_revision" != "$EXPECTED_REVISION" ]]; then
            echo "Release tag $RELEASE_TAG points at $tagged_revision, expected $EXPECTED_REVISION" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing web image tag
        id: web_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-web
          TAG: ${{ steps.tags.outputs.web_tag }}
          MODE: ${{ steps.tags.outputs.mode }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          inspect_file="$(mktemp)"
          trap 'rm -f "$inspect_file"' EXIT
          if docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Image}}' >"$inspect_file" 2>&1; then
            if jq -e --arg revision "$EXPECTED_REVISION" --arg source "$EXPECTED_SOURCE" --arg version "$EXPECTED_VERSION" --arg mode "$MODE" '
              def configs:
                if (.config? | type) == "object" then [.config]
                else [to_entries[] | .value.config? | select(type == "object")]
                end;
              configs
              | if length == 0 then false
                else all(.[]; (((.Labels? // {}) | .["org.opencontainers.image.revision"]) == $revision
                  and ((.Labels? // {}) | .["org.opencontainers.image.source"]) == $source
                  and ($mode == "main" or ((.Labels? // {}) | .["org.opencontainers.image.version"]) == $version)))
                end
            ' "$inspect_file" >/dev/null; then
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            else
              echo "Existing $MODE tag has unexpected OCI labels: $IMAGE:$TAG" >&2
              cat "$inspect_file" >&2
              exit 1
            fi
          elif [[ "$MODE" == release ]]; then
            if grep -Eiq 'manifest unknown|name unknown|no such manifest|not found|404' "$inspect_file"; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
            else
              echo "Could not determine whether release tag exists: $IMAGE:$TAG" >&2
              cat "$inspect_file" >&2
              exit 1
            fi
          else
            echo "::notice title=SHA tag inspect failed::Inspecting $IMAGE:$TAG failed; build/push will be attempted."
            cat "$inspect_file" >&2
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push web image
        if: steps.web_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production web image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Check existing migration image tag
        id: migrate_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-migrate
          TAG: ${{ steps.tags.outputs.migrate_tag }}
          MODE: ${{ steps.tags.outputs.mode }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          inspect_file="$(mktemp)"
          trap 'rm -f "$inspect_file"' EXIT
          if docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Image}}' >"$inspect_file" 2>&1; then
            if jq -e --arg revision "$EXPECTED_REVISION" --arg source "$EXPECTED_SOURCE" --arg version "$EXPECTED_VERSION" --arg mode "$MODE" '
              def configs:
                if (.config? | type) == "object" then [.config]
                else [to_entries[] | .value.config? | select(type == "object")]
                end;
              configs
              | if length == 0 then false
                else all(.[]; (((.Labels? // {}) | .["org.opencontainers.image.revision"]) == $revision
                  and ((.Labels? // {}) | .["org.opencontainers.image.source"]) == $source
                  and ($mode == "main" or ((.Labels? // {}) | .["org.opencontainers.image.version"]) == $version)))
                end
            ' "$inspect_file" >/dev/null; then
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            else
              echo "Existing $MODE tag has unexpected OCI labels: $IMAGE:$TAG" >&2
              cat "$inspect_file" >&2
              exit 1
            fi
          elif [[ "$MODE" == release ]]; then
            if grep -Eiq 'manifest unknown|name unknown|no such manifest|not found|404' "$inspect_file"; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
            else
              echo "Could not determine whether release tag exists: $IMAGE:$TAG" >&2
              cat "$inspect_file" >&2
              exit 1
            fi
          else
            echo "::notice title=SHA tag inspect failed::Inspecting $IMAGE:$TAG failed; build/push will be attempted."
            cat "$inspect_file" >&2
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push migration image
        if: steps.migrate_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production migrate image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true
      - name: Promote web image to latest
        if: steps.tags.outputs.promote_latest == 'true'
        run: docker buildx imagetools create -t ghcr.io/takano536/kobako-web:latest ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
      - name: Promote migration image to latest
        if: steps.tags.outputs.promote_latest == 'true'
        run: docker buildx imagetools create -t ghcr.io/takano536/kobako-migrate:latest ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
