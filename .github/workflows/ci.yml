name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep main release runs serialized. Pull request and manually dispatched
  # checks may be cancelled while queued, but an in-progress main release is
  # never cancelled.
  group: >-
    kobako-ci-${{
      github.event_name == 'push' && github.ref == 'refs/heads/main'
        && 'main-release'
        || format('{0}-{1}', github.event_name, github.ref)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: node scripts/validate-release-files.mjs
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI-only credentials; these are not production secrets.
      DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_dev
      TEST_DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci_kobako
          POSTGRES_PASSWORD: ci_kobako_password
          POSTGRES_DB: kobako_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_kobako -d kobako_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Create isolated test database
        run: PGPASSWORD=ci_kobako_password psql -h localhost -U ci_kobako -d kobako_dev -c 'CREATE DATABASE kobako_test'
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # E2E runs the web server and cleanup against this dedicated test DB.
      # DATABASE_URL is intentionally unset, so the guard only verifies TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_e2e_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci_kobako
          POSTGRES_PASSWORD: ci_kobako_password
          POSTGRES_DB: kobako_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_kobako -d kobako_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          tags: kobako-web:local
          load: true
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          tags: kobako-migrate:local
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          tags: kobako-worker:local
          load: true
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=kobako-worker
          cache-to: type=gha,mode=max,scope=kobako-worker,ignore-error=true
      - name: Create CI compose environment
        run: |
          cat > .env <<'EOF'
          # Fixed CI-only values; not production secrets.
          POSTGRES_USER=kobako_ci
          POSTGRES_PASSWORD=kobako_ci_password
          POSTGRES_DB=kobako
          COMPOSE_DATABASE_URL=postgresql://kobako_ci:kobako_ci_password@postgres:5432/kobako
          EOF
      - name: Validate Compose configurations
        run: |
          docker compose config >/dev/null
      - name: Start Compose stack and verify health
        run: |
          docker compose up -d
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo 'Compose health checks did not become ready' >&2
              exit 1
            fi
            sleep 5
          done
          test "$(docker compose ps -aq migrate | xargs docker inspect -f '{{.State.ExitCode}}')" = 0
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/api/health/db
      - name: Wait for idle worker and web services
        run: |
          sleep 30
          running_services="$(docker compose ps --status running --services)"
          for service in web worker; do
            if ! printf '%s\n' "$running_services" | grep -qx "$service"; then
              echo "Expected $service to remain running; got:" >&2
              printf '%s\n' "$running_services" >&2
              exit 1
            fi
          done
      - name: Stop services and verify graceful shutdown
        run: |
          docker compose stop -t 20
          web_container_id="$(docker compose ps -aq web)"
          worker_container_id="$(docker compose ps -aq worker)"
          test -n "$web_container_id"
          test -n "$worker_container_id"
          web_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$web_container_id")"
          worker_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$worker_container_id")"
          echo "web exit code: $web_exit_code"
          echo "worker exit code: $worker_exit_code"
          # Next standalone closes HTTP before its conventional SIGTERM exit 143; 137 is a timeout/SIGKILL.
          if [ "$web_exit_code" = 137 ]; then
            echo 'web was SIGKILLed or timed out' >&2
            exit 1
          fi
          if [ "$web_exit_code" != 0 ] && [ "$web_exit_code" != 143 ]; then
            echo "unexpected web exit code: $web_exit_code" >&2
            exit 1
          fi
          test "$worker_exit_code" = 0
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  release_please:
    name: release-please
    needs: [lint, unit, integration, build, e2e, docker]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: read
    outputs:
      at_tip: ${{ steps.main_tip.outputs.at_tip }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_target_sha: ${{ steps.release.outputs.sha }}
      release_merge_sha: ${{ steps.pending_release.outputs.release_merge_sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      release_pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm this run is still the main tip
        id: main_tip
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" == "$EXPECTED_SHA" ]]; then
            echo 'at_tip=true' >>"$GITHUB_OUTPUT"
          else
            echo "main moved to $main_sha while this run targets $EXPECTED_SHA; skipping Release Please"
            echo 'at_tip=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Verify merged Release PR and required checks
        id: pending_release
        if: steps.main_tip.outputs.at_tip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-merge.sh
      - name: Create or update Release PR
        id: release
        if: >-
          steps.main_tip.outputs.at_tip == 'true' &&
          steps.pending_release.outputs.validated == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Fail closed: only let the action tag/release a merged pending PR
          # when our own guard freshly found and validated it via the Checks
          # API. `gh pr list --label` can read from a lagging search index,
          # so a false "no pending release" from the guard must not let the
          # action's own (more current) internal lookup create a release for
          # a commit whose required checks this workflow never confirmed.
          skip-github-release: ${{ steps.pending_release.outputs.pending_release != 'true' }}

  release_pr_checks:
    name: release-pr-checks
    needs: release_please
    if: >-
      needs.release_please.result == 'success' &&
      needs.release_please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch quality gate for Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ needs.release_please.outputs.release_pr }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PR_JSON" ]]; then
            echo 'Release Please reported prs_created but returned no pr output' >&2
            exit 1
          fi
          # v5 emits release-please's PullRequest shape, not a REST pull object.
          # The action's default fork=false means this is an open PR in this repo.
          pr_number="$(jq -r '.number // empty' <<<"$PR_JSON")"
          pr_base="$(jq -r '.baseBranchName // empty' <<<"$PR_JSON")"
          pr_ref="$(jq -r '.headBranchName // empty' <<<"$PR_JSON")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ || "$pr_base" != main ]]; then
            echo "Release Please returned an invalid Release PR object: number=$pr_number base=$pr_base" >&2
            exit 1
          fi
          if [[ "$pr_ref" != release-please--branches--main* ]]; then
            echo "Unexpected Release Please head branch: $pr_ref" >&2
            exit 1
          fi
          echo "Dispatching quality gate for Release PR #$pr_number on $pr_ref"
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$pr_ref"

  publish_main:
    name: publish-main
    needs: [lint, unit, integration, build, e2e, docker, release_please]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release_please.result != 'cancelled' &&
      needs.release_please.outputs.at_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compute main image tags
        id: tags
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_CREATED: false
          RELEASE_TAG: ''
        run: ./scripts/compute-release-tags.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing web SHA image
        id: web_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-web
          TAG: ${{ steps.tags.outputs.web_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          STRICT_INSPECT: false
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push web SHA image
        if: steps.web_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production web image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Check existing migration SHA image
        id: migrate_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-migrate
          TAG: ${{ steps.tags.outputs.migrate_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          STRICT_INSPECT: false
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push migration SHA image
        if: steps.migrate_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production migrate image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true
      - name: Re-confirm main tip before promoting latest
        id: promote_tip
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" == "$EXPECTED_SHA" ]]; then
            echo 'at_tip=true' >>"$GITHUB_OUTPUT"
          else
            echo "main moved to $main_sha since this run targeted $EXPECTED_SHA; a rerun must not move latest backward" >&2
            echo 'at_tip=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Promote web image to latest
        if: steps.promote_tip.outputs.at_tip == 'true'
        run: docker buildx imagetools create -t ghcr.io/takano536/kobako-web:latest ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
      - name: Promote migration image to latest
        if: steps.promote_tip.outputs.at_tip == 'true'
        run: docker buildx imagetools create -t ghcr.io/takano536/kobako-migrate:latest ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}

  publish_release:
    name: publish-release
    needs: [lint, unit, integration, build, e2e, docker, release_please]
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release_please.result != 'cancelled' &&
      needs.release_please.outputs.at_tip == 'true' &&
      needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the Release PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.release_merge_sha }}
          fetch-depth: 0
      - name: Compute release image tags
        id: tags
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_SHA: ${{ needs.release_please.outputs.release_merge_sha }}
          RELEASE_CREATED: true
          RELEASE_TAG: ${{ needs.release_please.outputs.release_tag }}
        run: ./scripts/compute-release-tags.sh
      - name: Verify Release Please tag points at the Release PR merge commit
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          EXPECTED_REVISION: ${{ needs.release_please.outputs.release_merge_sha }}
          RELEASE_TARGET_SHA: ${{ needs.release_please.outputs.release_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          if [[ -z "$remote_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not exist on origin" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TARGET_SHA" && "$RELEASE_TARGET_SHA" != "$EXPECTED_REVISION" ]]; then
            echo "Release Please reported target $RELEASE_TARGET_SHA, expected $EXPECTED_REVISION" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tagged_revision="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tagged_revision" != "$EXPECTED_REVISION" ]]; then
            echo "Release tag $RELEASE_TAG points at $tagged_revision, expected $EXPECTED_REVISION" >&2
            exit 1
          fi
      - name: Check out the verified Release tag commit
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: git checkout --detach "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing release web image
        id: web_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-web
          TAG: ${{ steps.tags.outputs.web_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ needs.release_please.outputs.release_merge_sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          STRICT_INSPECT: true
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push release web image
        if: steps.web_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ needs.release_please.outputs.release_merge_sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production web image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ needs.release_please.outputs.release_merge_sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Check existing release migration image
        id: migrate_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-migrate
          TAG: ${{ steps.tags.outputs.migrate_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ needs.release_please.outputs.release_merge_sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          STRICT_INSPECT: true
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push release migration image
        if: steps.migrate_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ needs.release_please.outputs.release_merge_sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production migrate image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ needs.release_please.outputs.release_merge_sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true
