name: CI

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

env:
  RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}

concurrency:
  # Push runs are keyed by SHA so a later main push cannot evict a pending release run.
  group: >-
    ${{ github.event_name == 'push' && format('kobako-ci-push-{0}', github.sha) ||
    format('kobako-ci-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: node scripts/validate-release-files.mjs
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI-only credentials; these are not production secrets.
      DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_dev
      TEST_DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci_kobako
          POSTGRES_PASSWORD: ci_kobako_password
          POSTGRES_DB: kobako_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_kobako -d kobako_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Create isolated test database
        run: PGPASSWORD=ci_kobako_password psql -h localhost -U ci_kobako -d kobako_dev -c 'CREATE DATABASE kobako_test'
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # E2E runs the web server and cleanup against this dedicated test DB.
      # DATABASE_URL is intentionally unset, so the guard only verifies TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgresql://ci_kobako:ci_kobako_password@localhost:5432/kobako_e2e_test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ci_kobako
          POSTGRES_PASSWORD: ci_kobako_password
          POSTGRES_DB: kobako_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_kobako -d kobako_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          tags: kobako-web:local
          load: true
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          tags: kobako-migrate:local
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          tags: kobako-worker:local
          load: true
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=kobako-worker
          cache-to: type=gha,mode=max,scope=kobako-worker,ignore-error=true
      - name: Create CI compose environment
        run: |
          cat > .env <<'EOF'
          # Fixed CI-only values; not production secrets.
          POSTGRES_USER=kobako_ci
          POSTGRES_PASSWORD=kobako_ci_password
          POSTGRES_DB=kobako
          COMPOSE_DATABASE_URL=postgresql://kobako_ci:kobako_ci_password@postgres:5432/kobako
          EOF
      - name: Validate Compose configurations
        run: |
          docker compose config >/dev/null
          if docker compose config --services | grep -qx migrate; then
            echo 'standard Compose configuration must not include migrate service' >&2
            exit 1
          fi
      - name: Start Compose stack and verify health
        run: |
          docker compose up -d
          for attempt in $(seq 1 36); do
            web_container_id="$(docker compose ps -q web)"
            web_health=''
            if [ -n "$web_container_id" ]; then
              web_health="$(docker inspect -f '{{.State.Health.Status}}' "$web_container_id" || true)"
            fi
            if [ "$web_health" = healthy ] \
              && curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/transactions >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo 'Compose health checks did not become ready' >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/api/health/db
          curl --fail http://127.0.0.1:3000/transactions
      - name: Verify bundled migrator in web image
        run: |
          docker run --rm --entrypoint sh kobako-web:local -c \
            'test -f /app/migrator/dist/migrate.js && test -f /app/migrator/drizzle/meta/_journal.json'
      - name: Verify standalone migration image remains usable
        run: |
          postgres_container_id="$(docker compose ps -q postgres)"
          compose_network="$(docker inspect -f '{{range $network, $_ := .NetworkSettings.Networks}}{{$network}}{{end}}' "$postgres_container_id")"
          database_url='postgresql://kobako_ci:kobako_ci_password@postgres:5432/kobako'
          before="$(docker compose exec -T postgres psql -U kobako_ci -d kobako -Atc 'select count(*) from drizzle.__drizzle_migrations')"
          docker run --rm --network "$compose_network" -e "DATABASE_URL=$database_url" kobako-migrate:local
          after="$(docker compose exec -T postgres psql -U kobako_ci -d kobako -Atc 'select count(*) from drizzle.__drizzle_migrations')"
          test "$after" = "$before"
      - name: Wait for idle worker and web services
        run: |
          sleep 30
          running_services="$(docker compose ps --status running --services)"
          for service in web worker; do
            if ! printf '%s\n' "$running_services" | grep -qx "$service"; then
              echo "Expected $service to remain running; got:" >&2
              printf '%s\n' "$running_services" >&2
              exit 1
            fi
          done
          bad_services="$(docker compose ps -a --format '{{.Service}} {{.State}}' | grep -Ei ' (exited|dead|created)' || true)"
          if [ -n "$bad_services" ]; then
            echo 'Compose contains exited services unexpectedly:' >&2
            printf '%s\n' "$bad_services" >&2
            exit 1
          fi
      - name: Stop services and verify graceful shutdown
        run: |
          docker compose stop -t 20
          web_container_id="$(docker compose ps -aq web)"
          worker_container_id="$(docker compose ps -aq worker)"
          test -n "$web_container_id"
          test -n "$worker_container_id"
          web_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$web_container_id")"
          worker_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$worker_container_id")"
          echo "web exit code: $web_exit_code"
          echo "worker exit code: $worker_exit_code"
          # Next standalone closes HTTP before its conventional SIGTERM exit 143; 137 is a timeout/SIGKILL.
          if [ "$web_exit_code" = 137 ]; then
            echo 'web was SIGKILLed or timed out' >&2
            exit 1
          fi
          if [ "$web_exit_code" != 0 ] && [ "$web_exit_code" != 143 ]; then
            echo "unexpected web exit code: $web_exit_code" >&2
            exit 1
          fi
          test "$worker_exit_code" = 0
      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  release_candidate:
    name: release-candidate
    needs: [lint, unit, integration, build, e2e, docker]
    if: >-
      github.repository == 'takano536/kobako' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.candidate.outputs.is_release }}
      pr_number: ${{ steps.candidate.outputs.pr_number }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Identify a canonical merged Release PR
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: node scripts/release-automation.mjs classify-main-release

  release_please:
    name: release-please
    needs: [lint, unit, integration, build, e2e, docker, release_candidate, release_finalize]
    if: >-
      always() &&
      github.repository == 'takano536/kobako' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release_candidate.result == 'success' &&
      (
        needs.release_candidate.outputs.is_release != 'true' ||
        needs.release_finalize.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      at_tip: ${{ steps.main_tip.outputs.at_tip }}
    steps:
      - name: Check out live main for Release Please
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm this run is still the main tip
        id: main_tip
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_CANDIDATE: ${{ needs.release_candidate.outputs.is_release }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" == "$EXPECTED_SHA" ]]; then
            echo 'at_tip=true' >>"$GITHUB_OUTPUT"
          elif [[ "$RELEASE_CANDIDATE" == true ]]; then
            echo "main moved to $main_sha after release merge $EXPECTED_SHA; continuing Release Please on live main"
            echo 'at_tip=true' >>"$GITHUB_OUTPUT"
          else
            echo "main moved to $main_sha while this run targets $EXPECTED_SHA; skipping Release Please"
            echo 'at_tip=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Require repository-scoped Release App configuration
        if: steps.main_tip.outputs.at_tip == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_BOT_LOGIN" || -z "$APP_PRIVATE_KEY" ]]; then
            echo '::error::Release App is required. Set RELEASE_APP_CLIENT_ID and RELEASE_APP_BOT_LOGIN repository variables plus RELEASE_APP_PRIVATE_KEY secret; refusing GITHUB_TOKEN fallback.'
            exit 1
          fi
      - name: Create repository-scoped Release Please token
        id: release_app
        if: steps.main_tip.outputs.at_tip == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: takano536
          repositories: kobako
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Verify configured release App identity
        if: steps.main_tip.outputs.at_tip == 'true'
        env:
          APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
          EXPECTED_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: |
          node --input-type=module -e '
            if (!process.env.APP_SLUG || process.env.APP_SLUG + "[bot]" !== process.env.EXPECTED_BOT_LOGIN) {
              throw new Error("RELEASE_APP_BOT_LOGIN must match the configured App slug");
            }
          '
      - name: Create or update Release PR without releasing
        if: steps.main_tip.outputs.at_tip == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release_app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true

  release_finalize:
    name: release-finalize
    needs: [lint, unit, integration, build, e2e, docker, release_candidate]
    if: >-
      github.repository == 'takano536/kobako' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release_candidate.result == 'success' &&
      needs.release_candidate.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kobako-release-finalize-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      version: ${{ steps.target.outputs.version }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Check out the exact merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate canonical merged Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ needs.release_candidate.outputs.pr_number }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: node scripts/release-automation.mjs validate-main-release
      - name: Check existing immutable tag and Release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-release-target.mjs probe
      - name: Create tag and GitHub Release through Release Please
        id: release
        if: steps.existing.outputs.target_state == 'absent'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: false
          skip-github-pull-request: true
      - name: Verify tag and Release target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.existing.outputs.release_tag || steps.release.outputs.tag_name }}
        run: node scripts/verify-release-target.mjs verify
      - name: Ensure canonical Release PR is tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ needs.release_candidate.outputs.pr_number }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: node scripts/release-automation.mjs repair-release-label

  publish_main:
    name: publish-main
    needs:
      [
        lint,
        unit,
        integration,
        build,
        e2e,
        docker,
        release_candidate,
        release_please,
        release_finalize,
      ]
    if: >-
      always() &&
      github.repository == 'takano536/kobako' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release_candidate.outputs.is_release != 'true' &&
      needs.release_please.result == 'success' &&
      needs.release_please.outputs.at_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      web_tag: ${{ steps.tags.outputs.web_tag }}
      migrate_tag: ${{ steps.tags.outputs.migrate_tag }}
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Compute immutable SHA image tags
        id: tags
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_CREATED: false
          RELEASE_TAG: ''
        run: ./scripts/compute-release-tags.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing web SHA image
        id: web_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-web
          TAG: ${{ steps.tags.outputs.web_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push web SHA image
        if: steps.web_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production web image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Check existing migration SHA image
        id: migrate_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-migrate
          TAG: ${{ steps.tags.outputs.migrate_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push migration SHA image
        if: steps.migrate_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production migrate image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true

  publish_release:
    name: publish-release
    needs: [lint, unit, integration, build, e2e, docker, release_candidate, release_finalize]
    if: >-
      always() &&
      github.repository == 'takano536/kobako' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.release_candidate.outputs.is_release == 'true' &&
      needs.release_finalize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      web_tag: ${{ steps.tags.outputs.web_tag }}
      migrate_tag: ${{ steps.tags.outputs.migrate_tag }}
    steps:
      - name: Check out the exact release merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release target and compute image tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release_finalize.outputs.release_tag }}
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_CREATED: 'true'
        run: |
          set -euo pipefail
          node scripts/verify-release-target.mjs verify
          ./scripts/compute-release-tags.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing release web image
        id: web_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-web
          TAG: ${{ steps.tags.outputs.web_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Check existing release web SHA image
        id: web_sha_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-web
          TAG: ${{ steps.tags.outputs.sha_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push release web image
        if: steps.web_tag.outputs.exists != 'true' || steps.web_sha_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
            ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production web image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-web
          cache-to: type=gha,mode=max,scope=kobako-web,ignore-error=true
      - name: Check existing release migration image
        id: migrate_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-migrate
          TAG: ${{ steps.tags.outputs.migrate_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Check existing release migration SHA image
        id: migrate_sha_tag
        env:
          IMAGE: ghcr.io/takano536/kobako-migrate
          TAG: ${{ steps.tags.outputs.sha_tag }}
          EXPECTED_SOURCE: https://github.com/takano536/kobako
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.tags.outputs.version }}
          REQUIRE_VERSION: true
        run: ./scripts/check-image-labels.sh
      - name: Build and push release migration image
        if: steps.migrate_tag.outputs.exists != 'true' || steps.migrate_sha_tag.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
            ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/takano536/kobako
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.description=kobako production migrate image
          build-args: |
            OCI_SOURCE=https://github.com/takano536/kobako
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=kobako-migrate
          cache-to: type=gha,mode=max,scope=kobako-migrate,ignore-error=true

  promote_latest:
    name: promote-latest
    needs: [publish_main, publish_release]
    if: >-
      always() &&
      github.repository == 'takano536/kobako' &&
      github.event_name == 'push' &&
      (
        needs.publish_release.result == 'success' ||
        (
          needs.publish_main.result == 'success' &&
          needs.publish_release.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kobako-latest-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Re-confirm main tip inside the promotion lock
        id: promote_tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" == "$EXPECTED_SHA" ]]; then
            echo 'at_tip=true' >>"$GITHUB_OUTPUT"
          else
            echo "main moved to $main_sha since this run targeted $EXPECTED_SHA; refusing to move latest backward" >&2
            echo 'at_tip=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Select immutable image tags for latest
        id: tags
        env:
          RELEASE_RESULT: ${{ needs.publish_release.result }}
          RELEASE_WEB_TAG: ${{ needs.publish_release.outputs.web_tag }}
          RELEASE_MIGRATE_TAG: ${{ needs.publish_release.outputs.migrate_tag }}
          MAIN_WEB_TAG: ${{ needs.publish_main.outputs.web_tag }}
          MAIN_MIGRATE_TAG: ${{ needs.publish_main.outputs.migrate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_RESULT" == success ]]; then
            web_tag="$RELEASE_WEB_TAG"
            migrate_tag="$RELEASE_MIGRATE_TAG"
          else
            web_tag="$MAIN_WEB_TAG"
            migrate_tag="$MAIN_MIGRATE_TAG"
          fi
          if [[ -z "$web_tag" || -z "$migrate_tag" ]]; then
            echo 'publish job did not provide immutable image tags' >&2
            exit 1
          fi
          printf 'web_tag=%s\n' "$web_tag" >>"$GITHUB_OUTPUT"
          printf 'migrate_tag=%s\n' "$migrate_tag" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote web image to latest
        if: steps.promote_tip.outputs.at_tip == 'true'
        run: docker buildx imagetools create -t ghcr.io/takano536/kobako-web:latest ghcr.io/takano536/kobako-web:${{ steps.tags.outputs.web_tag }}
      - name: Promote migration image to latest
        if: steps.promote_tip.outputs.at_tip == 'true'
        run: docker buildx imagetools create -t ghcr.io/takano536/kobako-migrate:latest ghcr.io/takano536/kobako-migrate:${{ steps.tags.outputs.migrate_tag }}
