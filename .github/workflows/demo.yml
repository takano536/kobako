name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobako-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
    steps:
      - name: Check the demo configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${DATABASE_URL}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo 'デモ配備の secret が未設定のため skip しました（`CLOUDFLARE_API_TOKEN`、`CLOUDFLARE_ACCOUNT_ID`、`DEMO_DATABASE_URL`）。' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/setup

      - name: Build the worker bundle
        if: steps.config.outputs.ready == 'true'
        run: pnpm demo:build

      - name: Migrate and clear the demo database
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node packages/db/dist/migrate.js
          pnpm demo:purge

      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.tmp"
          {
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
            printf 'DEMO_RESET_TOKEN=%s\n' "${DEMO_RESET_TOKEN}"
          } > "${GITHUB_WORKSPACE}/.tmp/demo.env"
          pnpm exec wrangler deploy \
            --config wrangler.jsonc \
            --secrets-file "${GITHUB_WORKSPACE}/.tmp/demo.env" \
            --message "main ${GITHUB_SHA::7}"
          url=$(node scripts/workers-dev-url.mjs kobako-demo)
          echo "デモ: ${url}" >> "${GITHUB_STEP_SUMMARY}"
