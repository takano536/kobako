name: Preview demo

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kobako-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview:
    name: preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
    steps:
      - name: Check preview configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo 'プレビュー配備の secret が未設定のため skip しました。`CLOUDFLARE_API_TOKEN`、`CLOUDFLARE_ACCOUNT_ID`、`PREVIEW_DATABASE_URL` を repository secrets に登録すると有効になります。' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out the pull request head
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/setup

      - name: Write the preview config
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/web
        run: |
          set -euo pipefail
          sed "s/PR_NUMBER/${{ github.event.pull_request.number }}/g" wrangler.preview.jsonc \
            > wrangler.generated.jsonc

      - name: Stop the pull request preview
        if: steps.config.outputs.ready == 'true' && github.event.action == 'closed'
        working-directory: apps/web
        run: pnpm exec wrangler delete --config wrangler.generated.jsonc || true

      - name: Build the worker bundle
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        run: pnpm demo:build

      - name: Migrate and clear the preview database
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo 'PREVIEW_DATABASE_URL が未設定です。プレビュー用 database の接続文字列を secret に登録してください。' >&2
            exit 1
          fi
          node packages/db/dist/migrate.js
          pnpm demo:purge

      - name: Deploy the preview
        id: deploy
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.tmp"
          {
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
            printf 'DEMO_RESET_TOKEN=%s\n' "${DEMO_RESET_TOKEN}"
          } > "${GITHUB_WORKSPACE}/.tmp/preview.env"
          pnpm exec wrangler deploy \
            --config wrangler.generated.jsonc \
            --secrets-file "${GITHUB_WORKSPACE}/.tmp/preview.env" \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}"
          url=$(node scripts/workers-dev-url.mjs "pr-${{ github.event.pull_request.number }}")
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "プレビュー: ${url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment the preview URL
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="${GITHUB_WORKSPACE}/.tmp/preview-comment.md"
          {
            echo '<!-- kobako-preview -->'
            echo '## プレビュー'
            if [ -n "${PREVIEW_URL}" ]; then
              echo "https://${PREVIEW_URL#https://}"
              echo
              echo 'デモ用のデータだけが入った DB に接続しています。'
            else
              echo 'プレビュー URL を取得できませんでした。workflow のログと summary を確認してください。'
            fi
          } > "${body}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- kobako-preview -->")) | .id' | head -n 1)
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${body}" > /dev/null
          else
            gh pr comment "${PR_NUMBER}" --body-file "${body}" > /dev/null
          fi
