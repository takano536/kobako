name: Preview demo

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kobako-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview:
    name: preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
      DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      PREVIEW_WORKER_NAME: demo
    steps:
      - name: Check preview configuration
        id: config
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo 'プレビュー配備の secret が未設定のため skip しました。`CLOUDFLARE_API_TOKEN`、`CLOUDFLARE_ACCOUNT_ID`、`PREVIEW_DATABASE_URL` を repository secrets に登録すると有効になります。' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out the pull request head
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/setup

      - name: Stop the pull request preview
        if: steps.config.outputs.ready == 'true' && github.event.action == 'closed'
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm exec wrangler preview delete --name "${PREVIEW_NAME}" --skip-confirmation || true

      - name: Build the worker bundle
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        run: pnpm demo:build

      - name: Migrate and clear the preview database
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo 'PREVIEW_DATABASE_URL が未設定です。プレビュー用 database の接続文字列を secret に登録してください。' >&2
            exit 1
          fi
          node packages/db/dist/migrate.js
          pnpm demo:purge

      - name: Deploy the preview
        id: deploy
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        working-directory: apps/web
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.tmp"
          secrets_file="${GITHUB_WORKSPACE}/.tmp/preview.env"
          output="${GITHUB_WORKSPACE}/.tmp/preview.json"
          {
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
            printf 'DEMO_RESET_TOKEN=%s\n' "${DEMO_RESET_TOKEN}"
          } > "${secrets_file}"
          pnpm exec wrangler preview \
            --name "${PREVIEW_NAME}" \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" \
            --secrets-file "${secrets_file}" \
            --json > "${output}"
          url=$(node scripts/preview-output.mjs "${output}" preview-url)
          deployment_url=$(node scripts/preview-output.mjs "${output}" deployment-url)
          dashboard_url=$(node scripts/preview-output.mjs "${output}" dashboard-url)
          {
            echo "url=${url}"
            echo "deployment_url=${deployment_url}"
            echo "dashboard_url=${dashboard_url}"
          } >> "${GITHUB_OUTPUT}"
          echo "プレビュー: ${url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment the preview URL
        if: steps.config.outputs.ready == 'true' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="${GITHUB_WORKSPACE}/.tmp/preview-comment.md"
          {
            echo '<!-- kobako-preview -->'
            echo '## プレビュー'
            if [ -n "${PREVIEW_URL}" ]; then
              echo "https://${PREVIEW_URL#https://}"
              echo
              echo 'デモ用のデータだけが入った DB に接続しています。'
              echo
              echo "- 配備したコミット: [\`${HEAD_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${HEAD_SHA}) $(git log -1 --format=%s)"
              echo "- 配備時刻: $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M JST')"
              echo "- この配備だけの URL: ${DEPLOYMENT_URL}"
            else
              echo 'プレビュー URL を取得できませんでした。workflow のログと summary を確認してください。'
            fi
          } > "${body}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- kobako-preview -->")) | .id' | head -n 1)
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${body}" > /dev/null
          else
            gh pr comment "${PR_NUMBER}" --body-file "${body}" > /dev/null
          fi
